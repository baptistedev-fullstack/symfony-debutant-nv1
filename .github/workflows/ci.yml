name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer

      - name: Repérer le cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restaurer le cache Composer
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Valider composer.json
        run: composer validate --strict

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Linter la configuration YAML
        run: php bin/console lint:yaml config

      - name: Linter les templates Twig
        run: php bin/console lint:twig templates

      - name: Linter le conteneur
        run: php bin/console lint:container

      - name: Lancer les tests
        run: php bin/phpunit

      - name: Auditer les dépendances
        run: composer audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Démarrer les conteneurs
        run: docker compose up -d --build

      - name: Vérifier que /projets répond
        run: curl --retry 10 --retry-delay 2 --retry-all-errors -fsS http://localhost:8080/projets | grep -q 'Mini-blog'

      - name: Lancer les tests dans le conteneur
        run: docker compose exec -T app php bin/phpunit

      - name: Arrêter les conteneurs
        if: always()
        run: docker compose down -v
